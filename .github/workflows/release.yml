name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Package
        shell: bash
        run: |
          # The version comes from Cargo.toml, as for the installer, so both file names match.
          # Carriage returns are removed first: the Windows runner checks files out with CRLF.
          version=$(tr -d '\r' < Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p' | head -n 1)
          mkdir -p dist/SoftromedaScreenRecorder
          cp target/release/softromeda-screen-recorder.exe README.md LICENSE NOTICE dist/SoftromedaScreenRecorder/
          cd dist
          7z a "../SoftromedaScreenRecorder-Portable-${version}-x64.zip" SoftromedaScreenRecorder
      - name: Installer
        shell: pwsh
        run: |
          # Inno Setup 6 or 7; build.ps1 finds either and reads the version from Cargo.toml.
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue
          if (-not $iscc) { choco install innosetup -y --no-progress }
          ./installer/build.ps1
      - uses: actions/upload-artifact@v5
        with:
          name: SoftromedaScreenRecorder
          path: |
            SoftromedaScreenRecorder-Portable-*-x64.zip
            installer/output/*.exe
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SoftromedaScreenRecorder-Portable-*-x64.zip
            installer/output/*.exe
